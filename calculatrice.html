<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Ma calculatrice</title>
    
    <style type="text/css">
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: hsl(0, 0%, 95%);
        }
        .calculator {
            font-family: Arial, sans-serif;
            background-color: hsl(0, 0%, 15%);
            border-radius: 15px;
            max-width: 500px;
            overflow: hidden;
            padding: 20px;
        }
        #display {
            width: 100%;
            padding: 20px;
            font-size: 5rem;
            text-align: right;
            border: none;
            background: hsl(0, 0%, 20%);
            color: white;
            border-radius: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        #keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 2rem;
            font-family: Arial, sans-serif;
            background-color: hsl(0, 0%, 30%);
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: hsl(0, 0%, 40%);
        }
        button:active {
            background-color: hsl(0, 0%, 50%);
        }
        .operator-btn {
            background-color: hsl(35, 100%, 55%);
        }
        .operator-btn:hover {
            background-color: hsl(35, 100%, 65%);
        }
        .operator-btn:active {
            background-color: hsl(35, 100%, 75%);
        }
        .zero-btn {
            grid-column: span 2;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input id="display" readonly>
        <div id="keys">
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('/')" class="operator-btn">÷</button>
            
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('*')" class="operator-btn">×</button>
            
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('-')" class="operator-btn">-</button>
            
            <button onclick="appendToDisplay('0')" class="zero-btn">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="calCulate()" class="operator-btn">=</button>
            <button onclick="appendToDisplay('+')" class="operator-btn">+</button>
            
            <button onclick="clearDisplay()" class="operator-btn" style="grid-column: span 4; border-radius: 10px; aspect-ratio: auto; height: 60px;">C</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        function appendToDisplay(input) {
            if (input === '.') {
                const parts = display.value.split(/[\+\-\*\/]/);
                const currentNumber = parts[parts.length - 1];
                if (currentNumber.includes('.')) {
                    return;
                }
            }
            display.value += input;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calCulate() {
            try {
                display.value = eval(display.value);
            } catch (e) {
                display.value = "Error";
            }
        }
    </script>
</body>
</html>
